<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="aws" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ffac31"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="url(#bg)"/>

  <!-- Outer Border -->
  <rect x="20" y="20" width="760" height="510" rx="12" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
  <rect x="28" y="28" width="744" height="494" rx="8" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- Decorative Corners -->
  <path d="M 20 50 L 50 20 M 780 50 L 750 20 M 20 500 L 50 530 M 780 500 L 750 530" stroke="url(#gold)" stroke-width="2" opacity="0.8"/>

  <!-- Watermark Logo Pattern -->
  <circle cx="400" cy="275" r="140" fill="none" stroke="#27272a" stroke-width="1" opacity="0.3" stroke-dasharray="4 4"/>

  <!-- AWS Badge Icon -->
  <g transform="translate(360, 60)">
    <polygon points="40,0 75,20 75,60 40,80 5,60 5,20" fill="#18181b" stroke="url(#aws)" stroke-width="3"/>
    <text x="40" y="48" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ff9900" text-anchor="middle">AWS</text>
  </g>

  <!-- Issuer -->
  <text x="400" y="180" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="4">AMAZON WEB SERVICES</text>

  <!-- Title -->
  <text x="400" y="225" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">AWS Certified Solutions Architect</text>
  <text x="400" y="255" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#f59e0b" text-anchor="middle" letter-spacing="2">ASSOCIATE</text>

  <!-- Divider -->
  <line x1="250" y1="280" x2="550" y2="280" stroke="#3f3f46" stroke-width="1"/>

  <!-- Awarded To -->
  <text x="400" y="315" font-family="system-ui, sans-serif" font-size="13" fill="#71717a" text-anchor="middle">This is to certify that</text>
  <text x="400" y="355" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">DIYOR KHASANOV</text>
  <text x="400" y="385" font-family="system-ui, sans-serif" font-size="13" fill="#a1a1aa" text-anchor="middle">has successfully completed all validation requirements for cloud architecture</text>

  <!-- Verification Details -->
  <g transform="translate(100, 440)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#71717a">Validation ID: AWS-PSA-982143</text>
    <text x="0" y="18" font-family="monospace" font-size="11" fill="#71717a">Issue Date: Oct 2023</text>
  </g>

  <g transform="translate(540, 440)">
    <text x="160" y="0" font-family="monospace" font-size="11" fill="#10b981" text-anchor="end">✓ VERIFIED CREDENTIAL</text>
    <text x="160" y="18" font-family="monospace" font-size="11" fill="#71717a" text-anchor="end">Category: Cloud &amp; Infrastructure</text>
  </g>

  <!-- Gold Seal -->
  <g transform="translate(400, 455)">
    <circle cx="0" cy="0" r="24" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="20" fill="#09090b"/>
    <path d="M-8 0 L-2 6 L8 -6" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
