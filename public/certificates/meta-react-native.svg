<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="rn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61dafb"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="510" rx="12" fill="none" stroke="url(#rn)" stroke-width="2" opacity="0.6"/>
  <rect x="28" y="28" width="744" height="494" rx="8" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- React Native Orbit Icon -->
  <g transform="translate(400, 75)">
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="none" stroke="#61dafb" stroke-width="3" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="none" stroke="#61dafb" stroke-width="3" transform="rotate(90)"/>
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="none" stroke="#61dafb" stroke-width="3" transform="rotate(150)"/>
    <circle cx="0" cy="0" r="5" fill="#a855f7"/>
  </g>

  <text x="400" y="165" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#a1a1aa" text-anchor="middle" letter-spacing="4">META SPECIALIZATION</text>
  <text x="400" y="210" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">Meta React Native Specialization</text>
  <text x="400" y="240" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#a855f7" text-anchor="middle" letter-spacing="2">CROSS-PLATFORM MOBILE ARCHITECTURE</text>

  <line x1="250" y1="270" x2="550" y2="270" stroke="#3f3f46" stroke-width="1"/>

  <text x="400" y="305" font-family="system-ui, sans-serif" font-size="13" fill="#71717a" text-anchor="middle">This professional certificate confirms that</text>
  <text x="400" y="345" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">DIYOR KHASANOV</text>
  <text x="400" y="375" font-family="system-ui, sans-serif" font-size="13" fill="#a1a1aa" text-anchor="middle">has mastered React Native, Expo, Native Modules &amp; Cross-Platform UI Design</text>

  <g transform="translate(100, 440)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#71717a">Credential ID: META-RN-331089</text>
    <text x="0" y="18" font-family="monospace" font-size="11" fill="#71717a">Issued: Nov 2022</text>
  </g>

  <g transform="translate(540, 440)">
    <text x="160" y="0" font-family="monospace" font-size="11" fill="#10b981" text-anchor="end">✓ VERIFIED CREDENTIAL</text>
    <text x="160" y="18" font-family="monospace" font-size="11" fill="#71717a" text-anchor="end">Category: Mobile Engineering</text>
  </g>

  <g transform="translate(400, 455)">
    <circle cx="0" cy="0" r="24" fill="url(#rn)"/>
    <circle cx="0" cy="0" r="20" fill="#09090b"/>
    <path d="M-8 0 L-2 6 L8 -6" stroke="#61dafb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
