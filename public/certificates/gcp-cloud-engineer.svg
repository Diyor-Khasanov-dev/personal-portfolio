<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="gcp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="33%" stop-color="#ea4335"/>
      <stop offset="66%" stop-color="#fbbc05"/>
      <stop offset="100%" stop-color="#34a853"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="510" rx="12" fill="none" stroke="url(#gcp)" stroke-width="2" opacity="0.6"/>
  <rect x="28" y="28" width="744" height="494" rx="8" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- GCP Logo Badge -->
  <g transform="translate(370, 55)">
    <path d="M 30 10 L 10 30 L 20 50 L 50 50 L 60 30 Z" fill="none" stroke="#4285f4" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="30" cy="30" r="10" fill="#34a853"/>
  </g>

  <text x="400" y="165" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#a1a1aa" text-anchor="middle" letter-spacing="4">GOOGLE CLOUD PLATFORM</text>
  <text x="400" y="210" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">Google Associate Cloud Engineer</text>
  <text x="400" y="240" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#4285f4" text-anchor="middle" letter-spacing="2">OFFICIAL CLOUD CERTIFICATION</text>

  <line x1="250" y1="270" x2="550" y2="270" stroke="#3f3f46" stroke-width="1"/>

  <text x="400" y="305" font-family="system-ui, sans-serif" font-size="13" fill="#71717a" text-anchor="middle">This is to certify that</text>
  <text x="400" y="345" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">DIYOR KHASANOV</text>
  <text x="400" y="375" font-family="system-ui, sans-serif" font-size="13" fill="#a1a1aa" text-anchor="middle">has successfully validated proficiency in deploying GCP infra &amp; Kubernetes systems</text>

  <g transform="translate(100, 440)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#71717a">Credential ID: GCP-ACE-440192</text>
    <text x="0" y="18" font-family="monospace" font-size="11" fill="#71717a">Issued: Aug 2022</text>
  </g>

  <g transform="translate(540, 440)">
    <text x="160" y="0" font-family="monospace" font-size="11" fill="#10b981" text-anchor="end">✓ VERIFIED CREDENTIAL</text>
    <text x="160" y="18" font-family="monospace" font-size="11" fill="#71717a" text-anchor="end">Category: Cloud &amp; Infrastructure</text>
  </g>

  <g transform="translate(400, 455)">
    <circle cx="0" cy="0" r="24" fill="url(#gcp)"/>
    <circle cx="0" cy="0" r="20" fill="#09090b"/>
    <path d="M-8 0 L-2 6 L8 -6" stroke="#34a853" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
